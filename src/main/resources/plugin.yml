name: MineGames
version: 1.0.5
author: cev-api
main: dev.minegame.mines.MinegamePlugin
api-version: "1.21"
depend:
  - Vault
softdepend:
  - EconomyProvider
commands:
  minegame:
    description: Start a mines game while standing on a beacon station.
    usage: /minegame <mines 1-24> <wager>
    aliases: [mine, mines]
  minegameadmin:
    description: Manage mines stations.
    usage: /minegameadmin <create|remove|regen|list|set|setframe|sethidden|setsafe|setmine|holo|hologramsign|debug|casinoframe|reload>
    aliases: [mineadmin]
  roulette:
    description: Place a roulette bet on the nearest roulette station.
    usage: /roulette <red|black|green> <amount>
  rouletteadmin:
    description: Manage roulette stations.
    usage: /rouletteadmin <create|remove|regen|list|set|casinoframe|reload>
  slotsadmin:
    description: Manage slots stations.
    usage: /slotsadmin <create [3-8] [1|2]|create shelves <1-32>|remove|regen|list|set|hologramsign|setouterframe|setinnerframe|setwinning|casinoframe|housebalance|housewithdraw|reload>
  fighter:
    description: Bet on a nearby Fights arena.
    usage: /fighter <1|2> <amount>
    aliases: [fight]
  fightadmin:
    description: Manage Fights arenas.
    usage: /fightadmin <create [size] [fighters]|fighters <#> <2-16>|move <#> [x y z]|remove <#>|regen [#]|list|holo>
  casinogui:
    description: Open the operator casino settings menu.
    usage: /casinogui
  minegamesjoin:
    description: Configure the new-player join gift.
    usage: /minegamesjoin <true|false|set <amount>>
permissions:
  mine.admin:
    default: op
  roulette.admin:
    default: op
  slots.admin:
    default: op
  minegamesjoin.admin:
    default: op
